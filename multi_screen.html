<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Screen Studio - Davide's Workshop</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0d0f1a;
            --bg-secondary: #12152a;
            --bg-card: #161828;
            --text-primary: #e8e8e8;
            --text-secondary: #9090b0;
            --accent: #f0c030;
            --accent-hover: #dca50c;
            --border-color: rgba(240,192,48,0.15);
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .header-left a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .room-info span {
            color: var(--accent);
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-hover), var(--accent));
            color: var(--bg-primary);
            border: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .login-box {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border-top: 4px solid var(--accent);
            width: 100%;
            max-width: 400px;
        }

        .login-box h2 {
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Studio Screen */
        .studio-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 1rem;
        }

        .studio-screen.active {
            display: flex;
        }

        /* Video Grid */
        .video-grid {
            flex: 1;
            display: grid;
            gap: 1rem;
            min-height: 400px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            overflow: hidden;
            position: relative;
        }

        .video-grid.grid-1 { grid-template-columns: 1fr; }
        .video-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-3 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-4 { grid-template-columns: repeat(2, 1fr); }
        .video-grid.grid-5 { grid-template-columns: repeat(3, 1fr); }
        .video-grid.grid-6 { grid-template-columns: repeat(3, 1fr); }
        .video-grid.grid-7 { grid-template-columns: repeat(3, 1fr); }
        .video-grid.grid-8 { grid-template-columns: repeat(4, 1fr); }
        .video-grid.grid-9 { grid-template-columns: repeat(3, 1fr); }

        .video-container {
            position: relative;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: visible;
            border: 2px solid var(--border-color);
            cursor: move;
            transition: border-color 0.2s;
            min-height: 100px;
        }

        .video-container:hover {
            border-color: var(--accent);
        }

        .video-container.dragging {
            opacity: 0.8;
            border-color: var(--accent);
            z-index: 1000;
        }

        .video-container.selected {
            border-color: var(--accent);
            border-width: 3px;
        }

        /* Resize handles */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border: 2px solid white;
            border-radius: 50%;
            z-index: 10;
            display: none;
        }

        .video-container:hover .resize-handle,
        .video-container.selected .resize-handle {
            display: block;
        }

        .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
        .resize-handle.n { top: -6px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .resize-handle.s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .resize-handle.e { right: -6px; top: 50%; transform: translateY(-50%); cursor: e-resize; }
        .resize-handle.w { left: -6px; top: 50%; transform: translateY(-50%); cursor: w-resize; }

        /* Crop mode */
        .video-container.cropping {
            outline: 2px dashed var(--accent);
            outline-offset: 2px;
        }

        .crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            display: none;
        }

        .video-container.cropping .crop-overlay {
            display: block;
        }

        .crop-area {
            position: absolute;
            border: 2px solid var(--accent);
            background: rgba(240, 192, 48, 0.1);
            pointer-events: none;
            display: none;
        }

        .video-container.cropping .crop-area {
            display: block;
        }

        .crop-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border: 2px solid var(--accent);
            border-radius: 50%;
            z-index: 20;
            cursor: pointer;
        }

        .crop-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .crop-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .crop-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }
        .crop-handle.n { top: -5px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .crop-handle.s { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .crop-handle.e { right: -5px; top: 50%; transform: translateY(-50%); cursor: e-resize; }
        .crop-handle.w { left: -5px; top: 50%; transform: translateY(-50%); cursor: w-resize; }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: transform 0.2s;
            pointer-events: none;
        }

        .video-container.video-scaled-50 video { transform: scale(0.5); }
        .video-container.video-scaled-75 video { transform: scale(0.75); }
        .video-container.video-scaled-100 video { transform: scale(1); }
        .video-container.video-scaled-125 video { transform: scale(1.25); }
        .video-container.video-scaled-150 video { transform: scale(1.5); }

        /* Grid positioning for free movement */
        .video-grid.free-position {
            display: block;
            position: relative;
            min-height: 600px;
        }

        .video-grid.free-position .video-container {
            position: absolute;
            width: 300px;
            height: 200px;
        }

        .video-grid:not(.free-position) .video-container {
            position: relative;
        }

        .video-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.5rem;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-label .name {
            font-weight: 600;
        }

        .video-label .controls {
            display: flex;
            gap: 0.3rem;
        }

        .video-label .btn-mini {
            padding: 0.2rem 0.5rem;
            font-size: 0.7rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
        }

        .video-label .btn-mini:hover {
            background: rgba(255,255,255,0.2);
        }

        .scale-indicator {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            pointer-events: none;
        }

        .empty-slot {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Bottom Controls */
        .bottom-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .control-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .control-group select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* Status indicators */
        .status-bar {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status-dot.active {
            background: var(--success);
            animation: pulse 1.5s infinite;
        }

        .status-dot.recording {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Recording indicator */
        .recording-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--danger);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            z-index: 1000;
            animation: pulse 1.5s infinite;
        }

        .recording-indicator.active {
            display: flex;
        }

        .recording-indicator::before {
            content: '';
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 0.5rem;
            }

            .controls {
                width: 100%;
                justify-content: center;
            }

            .video-grid {
                grid-template-columns: 1fr !important;
            }

            .bottom-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html">← Back</a>
            <h1>Multi-Screen Studio</h1>
        </div>
        <div class="room-info" id="roomInfo" style="display: none;">
            Room: <span id="roomCode"></span> | Users: <span id="userCount">0</span>
        </div>
        <div class="controls" id="headerControls" style="display: none;">
            <button class="btn btn-primary" id="shareScreenBtn" onclick="toggleScreenShare()">Share Screen</button>
            <button class="btn" id="addScreenBtn" onclick="addAdditionalScreen()">+ Add Screen</button>
            <button class="btn btn-success" id="recordBtn" onclick="toggleRecording()">Record</button>
            <button class="btn" onclick="showStreamSettings()">Stream Settings</button>
        </div>
    </header>

    <main>
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="login-box">
                <h2>Join Studio</h2>
                <div class="form-group">
                    <label>Room Name</label>
                    <input type="text" id="roomName" placeholder="Enter room name or create new">
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="userName" placeholder="Enter your name">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="joinRoom()">Join Studio</button>
            </div>
        </div>

        <!-- Studio Screen -->
        <div class="studio-screen" id="studioScreen">
            <div class="video-grid" id="videoGrid">
                <!-- Video containers will be added dynamically -->
            </div>

            <div class="bottom-controls">
                <div class="control-group">
                    <label>Layout:</label>
                    <select id="layoutSelect" onchange="changeLayout()">
                        <option value="auto">Auto Grid</option>
                        <option value="free" selected>Free Position (Drag & Resize)</option>
                        <option value="1">1 Screen</option>
                        <option value="2">2 Screens</option>
                        <option value="3">3 Screens</option>
                        <option value="4">4 Screens</option>
                        <option value="6">6 Screens</option>
                        <option value="9">9 Screens</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Quality:</label>
                    <select id="qualitySelect">
                        <option value="high">High (1080p)</option>
                        <option value="medium">Medium (720p)</option>
                        <option value="low">Low (480p)</option>
                    </select>
                </div>
                <div class="status-bar">
                    <div class="status-item">
                        <div class="status-dot" id="connectionStatus"></div>
                        <span id="connectionText">Disconnected</span>
                    </div>
                    <div class="status-item">
                        <div class="status-dot" id="sharingStatus"></div>
                        <span id="sharingText">Not Sharing</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="recording-indicator" id="recordingIndicator">
        Recording
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        // Global variables
        let peer = null;
        let roomName = '';
        let userName = '';
        let localStream = null;
        let additionalStreams = [];
        let connections = {};
        let calls = {};
        let screenStreams = {};
        let isSharing = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingStream = null;
        let gridLayout = 'auto';
        let draggedElement = null;
        let isCropping = false;
        let currentCropContainer = null;
        let cropData = {}; // Store crop data for each screen: { top, left, width, height }

        // Initialize
        function joinRoom() {
            roomName = document.getElementById('roomName').value.trim();
            userName = document.getElementById('userName').value.trim();

            if (!roomName || !userName) {
                alert('Please fill in all fields');
                return;
            }

            // Create peer with room-based ID
            peer = new Peer(`multiscreen-${roomName}-${userName}-${Date.now()}`);

            peer.on('open', (id) => {
                console.log('Connected with ID:', id);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('studioScreen').classList.add('active');
                document.getElementById('roomInfo').style.display = 'flex';
                document.getElementById('headerControls').style.display = 'flex';
                document.getElementById('roomCode').textContent = roomName;
                
                updateConnectionStatus(true);
                
                // Broadcast presence to room
                broadcastPresence();
            });

            peer.on('connection', (conn) => {
                handleConnection(conn);
            });

            peer.on('call', (call) => {
                handleCall(call);
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                alert('Connection error: ' + err.message);
            });
        }

        function broadcastPresence() {
            // In a real implementation, this would use a signaling server
            // For now, we'll use localStorage for same-browser communication
            const presence = {
                type: 'presence',
                peerId: peer.id,
                userName: userName,
                roomName: roomName,
                isSharing: isSharing,
                timestamp: Date.now()
            };
            
            localStorage.setItem(`multiscreen-presence-${peer.id}`, JSON.stringify(presence));
            
            // Also set a room-specific key for easier discovery
            localStorage.setItem(`multiscreen-room-${roomName}-${peer.id}`, JSON.stringify(presence));
            
            // Check for other users in the room
            checkForOtherUsers();
        }

        function checkForOtherUsers() {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                // Check both presence formats
                if ((key.startsWith('multiscreen-presence-') || key.startsWith('multiscreen-room-')) && 
                    key !== `multiscreen-presence-${peer.id}` && 
                    key !== `multiscreen-room-${roomName}-${peer.id}`) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        // Only connect if same room and recent (within 30 seconds)
                        if (data.roomName === roomName && (Date.now() - data.timestamp) < 30000) {
                            // Only connect if not already connected
                            if (!connections[data.peerId]) {
                                console.log('Found user in room:', data.userName);
                                const conn = peer.connect(data.peerId);
                                handleConnection(conn);
                            }
                        }
                    } catch (e) {
                        console.error('Error parsing presence data:', e);
                    }
                }
            }
        }

        function handleConnection(conn) {
            connections[conn.peer] = conn;
            
            conn.on('open', () => {
                console.log('Connected to:', conn.peer);
                updateUserCount();
                
                conn.on('data', (data) => {
                    handleData(conn, data);
                });
            });

            conn.on('close', () => {
                delete connections[conn.peer];
                removeVideoStream(conn.peer);
                updateUserCount();
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
            });
        }

        function handleData(conn, data) {
            switch (data.type) {
                case 'presence':
                    // Store user info and respond
                    connections[conn.peer].userName = data.userName;
                    conn.send({
                        type: 'presence-response',
                        peerId: peer.id,
                        userName: userName,
                        isSharing: isSharing
                    });
                    // If we're sharing, send our stream to them
                    if (isSharing && localStream) {
                        const call = peer.call(conn.peer, localStream);
                        handleCall(call);
                    }
                    break;
                case 'presence-response':
                    // Store user info
                    connections[conn.peer].userName = data.userName;
                    // If they're sharing, request their stream
                    if (data.isSharing) {
                        const call = peer.call(conn.peer, null);
                        handleCall(call);
                    }
                    break;
                case 'screen-sharing-started':
                    // Request their screen
                    if (peer) {
                        const call = peer.call(conn.peer, null);
                        handleCall(call);
                    }
                    break;
                case 'screen-sharing-stopped':
                    removeVideoStream(conn.peer);
                    break;
            }
        }

        function handleCall(call) {
            calls[call.peer] = call;
            
            call.on('stream', (stream) => {
                console.log('Received stream from:', call.peer);
                addVideoStream(call.peer, stream);
            });

            call.on('close', () => {
                delete calls[call.peer];
                removeVideoStream(call.peer);
            });

            call.on('error', (err) => {
                console.error('Call error:', err);
            });

            // Answer the call
            call.answer();
        }

        function addVideoStream(peerId, stream) {
            const grid = document.getElementById('videoGrid');
            
            // Remove existing stream from this peer
            removeVideoStream(peerId);
            
            const container = document.createElement('div');
            container.className = 'video-container';
            container.dataset.peerId = peerId;
            
            // Set initial position for free movement
            const grid = document.getElementById('videoGrid');
            const existingContainers = grid.querySelectorAll('.video-container');
            const index = existingContainers.length;
            
            // Check if we're in free position mode
            const isFreePosition = grid.classList.contains('free-position') || gridLayout === 'free';
            
            if (isFreePosition) {
                // Position in a grid pattern initially
                const positions = [
                    { left: 10, top: 10 },
                    { left: 330, top: 10 },
                    { left: 10, top: 230 },
                    { left: 330, top: 230 },
                    { left: 650, top: 10 },
                    { left: 650, top: 230 }
                ];
                
                const pos = positions[index % positions.length];
                container.style.position = 'absolute';
                container.style.left = pos.left + 'px';
                container.style.top = pos.top + 'px';
                container.style.width = '300px';
                container.style.height = '200px';
            } else {
                container.style.position = 'relative';
            }
            
            // Add drag events
            container.addEventListener('mousedown', (e) => {
                // Don't drag if clicking on resize handle or controls
                if (e.target.classList.contains('resize-handle') || 
                    e.target.closest('.video-label') ||
                    e.target.closest('.scale-indicator')) {
                    return;
                }
                handleDragStart.call(container, e);
            });
            
            // Add resize handles
            const handles = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
            handles.forEach(position => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${position}`;
                handle.addEventListener('mousedown', handleResizeStart);
                container.appendChild(handle);
            });
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            video.muted = false;
            
            const scaleIndicator = document.createElement('div');
            scaleIndicator.className = 'scale-indicator';
            scaleIndicator.textContent = '100%';
            scaleIndicator.dataset.scale = '100';
            
            const label = document.createElement('div');
            label.className = 'video-label';
            
            // Try to get user name from connections
            const conn = connections[peerId];
            let name;
            if (peerId === peer.id) {
                name = userName + ' (You)';
            } else if (conn && conn.userName) {
                name = conn.userName;
            } else {
                name = `User ${peerId.slice(-8)}`;
            }
            
            label.innerHTML = `
                <span class="name">${name}</span>
                <div class="controls">
                    <button class="btn btn-mini" onclick="toggleMute('${peerId}')">🔊</button>
                    <button class="btn btn-mini" onclick="cycleScale('${peerId}')" title="Scale">🔍</button>
                    <button class="btn btn-mini" onclick="toggleCropMode('${peerId}')" title="Crop">✂️</button>
                    <button class="btn btn-mini" onclick="resetCrop('${peerId}')" title="Reset Crop">↺</button>
                    <button class="btn btn-mini btn-danger" onclick="removeVideoStream('${peerId}')">✕</button>
                </div>
            `;
            
            container.appendChild(video);
            container.appendChild(scaleIndicator);
            
            // Add crop overlay and area
            const cropOverlay = document.createElement('div');
            cropOverlay.className = 'crop-overlay';
            container.appendChild(cropOverlay);
            
            const cropArea = document.createElement('div');
            cropArea.className = 'crop-area';
            cropArea.id = `crop-area-${peerId}`;
            
            // Add crop handles
            const cropHandles = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
            cropHandles.forEach(position => {
                const handle = document.createElement('div');
                handle.className = `crop-handle ${position}`;
                handle.dataset.position = position;
                handle.dataset.peerId = peerId;
                handle.addEventListener('mousedown', handleCropResizeStart);
                cropArea.appendChild(handle);
            });
            
            container.appendChild(cropArea);
            container.appendChild(label);
            grid.appendChild(container);
            
            updateLayout();
            updateUserCount();
        }

        function removeVideoStream(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (container) {
                container.remove();
                updateLayout();
            }
        }

        function updateUserCount() {
            const count = Object.keys(connections).length + (isSharing ? 1 : 0);
            document.getElementById('userCount').textContent = count;
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');
            
            if (connected) {
                dot.classList.add('active');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('active');
                text.textContent = 'Disconnected';
            }
        }

        async function toggleScreenShare() {
            const btn = document.getElementById('shareScreenBtn');
            const sharingDot = document.getElementById('sharingStatus');
            const sharingText = document.getElementById('sharingText');

            if (!isSharing) {
                try {
                    const quality = document.getElementById('qualitySelect').value;
                    const constraints = getQualityConstraints(quality);
                    
                    localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                    
                    isSharing = true;
                    btn.textContent = 'Stop Sharing';
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-danger');
                    sharingDot.classList.add('active');
                    sharingText.textContent = 'Sharing';
                    
                    // Add our own stream to the grid
                    addVideoStream(peer.id, localStream);
                    
                    // Share with all connected users
                    Object.keys(connections).forEach(peerId => {
                        const call = peer.call(peerId, localStream);
                        handleCall(call);
                    });
                    
                    // Notify others and update presence
                    Object.values(connections).forEach(conn => {
                        conn.send({ type: 'screen-sharing-started' });
                    });
                    broadcastPresence(); // Update presence to show we're sharing
                    
                    // Handle user stopping share via browser UI
                    localStream.getVideoTracks()[0].onended = () => {
                        stopScreenShare();
                    };
                    
                } catch (err) {
                    console.error('Error sharing screen:', err);
                    alert('Could not share screen: ' + err.message);
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            const btn = document.getElementById('shareScreenBtn');
            const sharingDot = document.getElementById('sharingStatus');
            const sharingText = document.getElementById('sharingText');

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            // Stop all additional streams
            additionalStreams.forEach(stream => {
                stream.getTracks().forEach(track => track.stop());
            });
            additionalStreams = [];

            localStream = null;
            isSharing = false;
            btn.textContent = 'Share Screen';
            btn.classList.remove('btn-danger');
            btn.classList.add('btn-primary');
            sharingDot.classList.remove('active');
            sharingText.textContent = 'Not Sharing';
            
            // Remove all local streams from grid
            document.querySelectorAll('.video-container[data-peer-id^="local-"]').forEach(container => {
                container.remove();
            });
            removeVideoStream(peer.id);
            
            // Close all calls
            Object.values(calls).forEach(call => {
                call.close();
            });
            calls = {};
            
            // Notify others and update presence
            Object.values(connections).forEach(conn => {
                conn.send({ type: 'screen-sharing-stopped' });
            });
            broadcastPresence(); // Update presence to show we stopped sharing
        }

        function getQualityConstraints(quality) {
            const constraints = {
                video: {
                    cursor: 'always'
                },
                audio: true
            };

            switch (quality) {
                case 'high':
                    constraints.video.width = { ideal: 1920 };
                    constraints.video.height = { ideal: 1080 };
                    constraints.video.frameRate = { ideal: 60 };
                    break;
                case 'medium':
                    constraints.video.width = { ideal: 1280 };
                    constraints.video.height = { ideal: 720 };
                    constraints.video.frameRate = { ideal: 30 };
                    break;
                case 'low':
                    constraints.video.width = { ideal: 854 };
                    constraints.video.height = { ideal: 480 };
                    constraints.video.frameRate = { ideal: 24 };
                    break;
            }

            return constraints;
        }

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const indicator = document.getElementById('recordingIndicator');

            if (!isRecording) {
                const grid = document.getElementById('videoGrid');
                const videos = grid.querySelectorAll('video');
                
                if (videos.length === 0) {
                    alert('No screens to record');
                    return;
                }

                // Create combined stream from all videos
                const streams = Array.from(videos).map(v => v.srcObject).filter(s => s);
                if (streams.length === 0) {
                    alert('No active streams to record');
                    return;
                }

                recordingStream = new MediaStream();
                streams.forEach(stream => {
                    stream.getTracks().forEach(track => {
                        recordingStream.addTrack(track);
                    });
                });

                const mimeType = getSupportedMimeType();
                if (!mimeType) {
                    alert('Recording is not supported in this browser');
                    return;
                }

                try {
                    mediaRecorder = new MediaRecorder(recordingStream, { mimeType });
                } catch (err) {
                    console.error('Could not start recorder:', err);
                    alert('Could not start recording: ' + err.message);
                    return;
                }

                recordedChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const extension = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `multiscreen-recording-${Date.now()}.${extension}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                    recordingStream = null;
                };

                mediaRecorder.start();
                isRecording = true;
                btn.textContent = 'Stop Recording';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-danger');
                indicator.classList.add('active');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = 'Record';
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-success');
                indicator.classList.remove('active');
            }
        }

        function getSupportedMimeType() {
            const types = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm',
                'video/mp4'
            ];
            return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
        }

        function changeLayout() {
            gridLayout = document.getElementById('layoutSelect').value;
            updateLayout();
        }

        function updateLayout() {
            const grid = document.getElementById('videoGrid');
            const containers = grid.querySelectorAll('.video-container');
            const count = containers.length;

            // Remove all layout classes
            grid.className = 'video-grid';

            if (gridLayout === 'free') {
                // Free positioning mode
                grid.classList.add('free-position');
                containers.forEach((container, index) => {
                    container.style.position = 'absolute';
                    container.style.width = '300px';
                    container.style.height = '200px';
                    
                    // If not already positioned, set initial position
                    if (!container.style.left || container.style.left === 'auto' || container.style.left === '0px') {
                        const positions = [
                            { left: 10, top: 10 },
                            { left: 330, top: 10 },
                            { left: 10, top: 230 },
                            { left: 330, top: 230 },
                            { left: 650, top: 10 },
                            { left: 650, top: 230 }
                        ];
                        const pos = positions[index % positions.length];
                        container.style.left = pos.left + 'px';
                        container.style.top = pos.top + 'px';
                    }
                });
            } else {
                // Grid layout mode
                containers.forEach(container => {
                    container.style.position = 'relative';
                    container.style.left = 'auto';
                    container.style.top = 'auto';
                    container.style.width = 'auto';
                    container.style.height = 'auto';
                });

                let layout;
                if (gridLayout === 'auto') {
                    // Auto layout based on number of screens
                    if (count <= 1) layout = '1';
                    else if (count <= 2) layout = '2';
                    else if (count <= 4) layout = '4';
                    else if (count <= 6) layout = '6';
                    else layout = '9';
                } else {
                    layout = gridLayout;
                }

                grid.classList.add(`grid-${layout}`);
            }
        }

        // Drag and drop functionality
        let isDragging = false;
        let isResizing = false;
        let currentResizeHandle = null;
        let startX, startY, startWidth, startHeight, startLeft, startTop;
        let dragOffsetX, dragOffsetY;

        function handleDragStart(e) {
            if (e.target.classList.contains('resize-handle')) return;
            
            isDragging = true;
            draggedElement = this;
            this.classList.add('dragging');
            
            const rect = this.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            
            e.preventDefault();
        }

        function handleDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                if (draggedElement) {
                    draggedElement.classList.remove('dragging');
                    draggedElement = null;
                }
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragMove(e) {
            if (!isDragging || !draggedElement) return;
            
            const grid = document.getElementById('videoGrid');
            const gridRect = grid.getBoundingClientRect();
            
            let newX = e.clientX - gridRect.left - dragOffsetX;
            let newY = e.clientY - gridRect.top - dragOffsetY;
            
            // Constrain to grid bounds
            newX = Math.max(0, Math.min(newX, gridRect.width - draggedElement.offsetWidth));
            newY = Math.max(0, Math.min(newY, gridRect.height - draggedElement.offsetHeight));
            
            draggedElement.style.left = newX + 'px';
            draggedElement.style.top = newY + 'px';
        }

        // Resize functionality
        function handleResizeStart(e) {
            e.stopPropagation();
            isResizing = true;
            currentResizeHandle = e.target;
            
            const container = e.target.closest('.video-container');
            startX = e.clientX;
            startY = e.clientY;
            startWidth = container.offsetWidth;
            startHeight = container.offsetHeight;
            startLeft = container.offsetLeft;
            startTop = container.offsetTop;
            
            e.preventDefault();
        }

        function handleResizeMove(e) {
            if (!isResizing || !currentResizeHandle) return;
            
            const container = currentResizeHandle.closest('.video-container');
            const handleClass = currentResizeHandle.className;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            let newWidth = startWidth;
            let newHeight = startHeight;
            let newLeft = startLeft;
            let newTop = startTop;
            
            if (handleClass.includes('e')) {
                newWidth = startWidth + deltaX;
            }
            if (handleClass.includes('w')) {
                newWidth = startWidth - deltaX;
                newLeft = startLeft + deltaX;
            }
            if (handleClass.includes('s')) {
                newHeight = startHeight + deltaY;
            }
            if (handleClass.includes('n')) {
                newHeight = startHeight - deltaY;
                newTop = startTop + deltaY;
            }
            
            // Minimum size constraints
            newWidth = Math.max(150, newWidth);
            newHeight = Math.max(100, newHeight);
            
            container.style.width = newWidth + 'px';
            container.style.height = newHeight + 'px';
            container.style.left = newLeft + 'px';
            container.style.top = newTop + 'px';
        }

        function handleResizeEnd(e) {
            isResizing = false;
            currentResizeHandle = null;
        }



        function toggleMute(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (container) {
                const video = container.querySelector('video');
                video.muted = !video.muted;
            }
        }

        function cycleScale(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (container) {
                const scales = ['', 'video-scaled-50', 'video-scaled-75', 'video-scaled-100', 'video-scaled-125', 'video-scaled-150'];
                const scaleLabels = ['100%', '50%', '75%', '100%', '125%', '150%'];
                const currentScale = scales.find(scale => container.classList.contains(scale)) || '';
                const currentIndex = scales.indexOf(currentScale);
                const nextIndex = (currentIndex + 1) % scales.length;
                
                // Remove current scale class
                if (currentScale) {
                    container.classList.remove(currentScale);
                }
                
                // Add new scale class
                const newScale = scales[nextIndex];
                if (newScale) {
                    container.classList.add(newScale);
                }
                
                // Update scale indicator
                const indicator = container.querySelector('.scale-indicator');
                if (indicator) {
                    indicator.textContent = scaleLabels[nextIndex];
                    indicator.dataset.scale = scaleLabels[nextIndex].replace('%', '');
                }
                
                console.log(`Scaled video to: ${scaleLabels[nextIndex]}`);
            }
        }

        function toggleFreePosition() {
            const grid = document.getElementById('videoGrid');
            grid.classList.toggle('free-position');
            updateLayout();
        }

        function toggleCropMode(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (container) {
                container.classList.toggle('cropping');
                isCropping = container.classList.contains('cropping');
                currentCropContainer = isCropping ? container : null;
                
                if (isCropping) {
                    // Initialize crop area to full size
                    const cropArea = container.querySelector('.crop-area');
                    const rect = container.getBoundingClientRect();
                    cropArea.style.top = '0px';
                    cropArea.style.left = '0px';
                    cropArea.style.width = '100%';
                    cropArea.style.height = '100%';
                    
                    // Reset crop data
                    cropData[peerId] = { top: 0, left: 0, width: 100, height: 100 };
                } else {
                    // Apply the crop
                    applyCrop(peerId);
                }
            }
        }

        let isCropResizing = false;
        let currentCropHandle = null;
        let cropStartX, cropStartY, cropStartWidth, cropStartHeight, cropStartLeft, cropStartTop;

        function handleCropResizeStart(e) {
            e.stopPropagation();
            isCropResizing = true;
            currentCropHandle = e.target;
            currentCropContainer = e.target.closest('.video-container');
            
            const cropArea = currentCropContainer.querySelector('.crop-area');
            const rect = cropArea.getBoundingClientRect();
            const containerRect = currentCropContainer.getBoundingClientRect();
            
            cropStartX = e.clientX;
            cropStartY = e.clientY;
            cropStartWidth = rect.width;
            cropStartHeight = rect.height;
            cropStartLeft = (rect.left - containerRect.left);
            cropStartTop = (rect.top - containerRect.top);
            
            e.preventDefault();
        }

        function handleCropResizeMove(e) {
            if (!isCropResizing || !currentCropContainer) return;
            
            const cropArea = currentCropContainer.querySelector('.crop-area');
            const handlePosition = currentCropHandle.dataset.position;
            const peerId = currentCropContainer.dataset.peerId;
            
            const deltaX = e.clientX - cropStartX;
            const deltaY = e.clientY - cropStartY;
            
            let newWidth = cropStartWidth;
            let newHeight = cropStartHeight;
            let newLeft = cropStartLeft;
            let newTop = cropStartTop;
            
            // Calculate new dimensions based on handle position
            if (handlePosition.includes('e')) {
                newWidth = cropStartWidth + deltaX;
            }
            if (handlePosition.includes('w')) {
                newWidth = cropStartWidth - deltaX;
                newLeft = cropStartLeft + deltaX;
            }
            if (handlePosition.includes('s')) {
                newHeight = cropStartHeight + deltaY;
            }
            if (handlePosition.includes('n')) {
                newHeight = cropStartHeight - deltaY;
                newTop = cropStartTop + deltaY;
            }
            
            // Constrain to container bounds
            const containerRect = currentCropContainer.getBoundingClientRect();
            newWidth = Math.max(50, Math.min(newWidth, containerRect.width - newLeft));
            newHeight = Math.max(50, Math.min(newHeight, containerRect.height - newTop));
            newLeft = Math.max(0, Math.min(newLeft, containerRect.width - newWidth));
            newTop = Math.max(0, Math.min(newTop, containerRect.height - newHeight));
            
            cropArea.style.width = newWidth + 'px';
            cropArea.style.height = newHeight + 'px';
            cropArea.style.left = newLeft + 'px';
            cropArea.style.top = newTop + 'px';
            
            // Store crop data as percentages
            cropData[peerId] = {
                left: (newLeft / containerRect.width) * 100,
                top: (newTop / containerRect.height) * 100,
                width: (newWidth / containerRect.width) * 100,
                height: (newHeight / containerRect.height) * 100
            };
        }

        function handleCropResizeEnd(e) {
            isCropResizing = false;
            currentCropHandle = null;
        }

        function applyCrop(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (!container || !cropData[peerId]) return;
            
            const video = container.querySelector('video');
            const crop = cropData[peerId];
            
            // Apply crop using CSS object-fit and positioning
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            const croppedWidth = (crop.width / 100) * containerWidth;
            const croppedHeight = (crop.height / 100) * containerHeight;
            const croppedLeft = (crop.left / 100) * containerWidth;
            const croppedTop = (crop.top / 100) * containerHeight;
            
            // Store original video dimensions
            if (!video.dataset.originalWidth) {
                video.dataset.originalWidth = video.videoWidth || video.offsetWidth;
                video.dataset.originalHeight = video.videoHeight || video.offsetHeight;
            }
            
            const originalWidth = parseFloat(video.dataset.originalWidth);
            const originalHeight = parseFloat(video.dataset.originalHeight);
            
            // Calculate scale to fill the cropped area
            const scaleX = croppedWidth / originalWidth;
            const scaleY = croppedHeight / originalHeight;
            const scale = Math.max(scaleX, scaleY);
            
            const scaledWidth = originalWidth * scale;
            const scaledHeight = originalHeight * scale;
            
            // Center the scaled video in the cropped area
            const offsetX = (croppedWidth - scaledWidth) / 2;
            const offsetY = (croppedHeight - scaledHeight) / 2;
            
            video.style.width = scaledWidth + 'px';
            video.style.height = scaledHeight + 'px';
            video.style.position = 'absolute';
            video.style.left = (croppedLeft + offsetX) + 'px';
            video.style.top = (croppedTop + offsetY) + 'px';
            video.style.objectFit = 'fill';
            
            // Hide crop overlay
            const cropOverlay = container.querySelector('.crop-overlay');
            const cropArea = container.querySelector('.crop-area');
            if (cropOverlay) cropOverlay.style.display = 'none';
            if (cropArea) cropArea.style.display = 'none';
        }

        function resetCrop(peerId) {
            const container = document.querySelector(`[data-peer-id="${peerId}"]`);
            if (!container) return;
            
            const video = container.querySelector('video');
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.position = 'static';
            video.style.objectFit = 'contain';
            video.style.left = 'auto';
            video.style.top = 'auto';
            
            delete cropData[peerId];
            
            // Reset crop area
            const cropArea = container.querySelector('.crop-area');
            if (cropArea) {
                cropArea.style.top = '0px';
                cropArea.style.left = '0px';
                cropArea.style.width = '100%';
                cropArea.style.height = '100%';
            }
        }

        function showStreamSettings() {
            alert('YouTube streaming integration requires RTMP setup.\n\nFor professional streaming:\n1. Set up YouTube Live stream\n2. Get RTMP URL and stream key\n3. Use streaming software like OBS\n4. Add this page as a browser source\n\nAlternatively, use the Record button and upload to YouTube later.');
        }

        async function addAdditionalScreen() {
            try {
                const quality = document.getElementById('qualitySelect').value;
                const constraints = getQualityConstraints(quality);
                
                const additionalStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                additionalStreams.push(additionalStream);
                
                // Add to grid with a unique ID
                const streamId = `local-${Date.now()}`;
                addVideoStream(streamId, additionalStream);
                
                // Share with all connected users
                Object.keys(connections).forEach(peerId => {
                    const call = peer.call(peerId, additionalStream);
                    handleCall(call);
                });
                
                // Handle user stopping share via browser UI
                additionalStream.getVideoTracks()[0].onended = () => {
                    removeVideoStream(streamId);
                    const index = additionalStreams.indexOf(additionalStream);
                    if (index > -1) {
                        additionalStreams.splice(index, 1);
                    }
                };
                
            } catch (err) {
                console.error('Error adding additional screen:', err);
                alert('Could not add screen: ' + err.message);
            }
        }

        // Add global event listeners for drag and resize
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                handleDragMove(e);
            }
            if (isResizing) {
                handleResizeMove(e);
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (isDragging) {
                handleDragEnd(e);
            }
            if (isResizing) {
                handleResizeEnd(e);
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            additionalStreams.forEach(stream => {
                stream.getTracks().forEach(track => track.stop());
            });
            if (peer) {
                peer.destroy();
            }
            // Clean up presence
            localStorage.removeItem(`multiscreen-presence-${peer.id}`);
            localStorage.removeItem(`multiscreen-room-${roomName}-${peer.id}`);
        });

        // Periodic presence update and cleanup
        setInterval(() => {
            if (peer && roomName) {
                broadcastPresence();
            }
            
            // Clean up old presence data (older than 60 seconds)
            const now = Date.now();
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('multiscreen-')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data.timestamp && (now - data.timestamp) > 60000) {
                            localStorage.removeItem(key);
                        }
                    } catch (e) {
                        // Remove invalid data
                        localStorage.removeItem(key);
                    }
                }
            }
        }, 5000); // Check every 5 seconds for better responsiveness
    </script>
